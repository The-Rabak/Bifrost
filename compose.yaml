services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: bifrost
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d bifrost
      interval: 2s
      timeout: 3s
      retries: 40
  broker:
    image: rabbitmq:4.3.0-management-alpine
    user: rabbitmq
    hostname: broker
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:?set BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?set BROKER_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2 +A 4'
      RABBITMQ_CTL_ERL_ARGS: '+S 1:1 +A 1'
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - -w
        - '2'
        - 127.0.0.1
        - '5672'
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
    volumes:
      - execution-data:/data
    networks:
      - execution
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 40
  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 220s
    networks:
      - internal
      - edge
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://${BROKER_USER:?set BROKER_USER}:${BROKER_PASSWORD:?set BROKER_PASSWORD}@broker/
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db/bifrost
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      MANAGEMENT_URL: http://broker:15672
      BROKER_USER: ${BROKER_USER}
      BROKER_PASSWORD: ${BROKER_PASSWORD}
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 2s
      timeout: 5s
      retries: 40
  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 220s
    networks:
      - internal
      - execution
    depends_on:
      broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BROKER_URL: amqp://${BROKER_USER:?set BROKER_USER}:${BROKER_PASSWORD:?set BROKER_PASSWORD}@broker/
      REDIS_URL: redis://redis:6379/0
      EXECUTION_NAMESPACE: bifrost:worker
    command: python -m bifrost.worker
volumes:
  pg-data:
  rabbit-data:
  execution-data:
networks:
  edge:
  internal:
    internal: true
  execution:
    internal: true
