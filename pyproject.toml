[project]
name = "bifrost"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "asyncpg>=0.32,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "redis>=6.4,<7",
    "email-validator>=2.2,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "ty>=0.0.1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
addopts = "-ra"
